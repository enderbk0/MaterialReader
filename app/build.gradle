import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace = 'com.enderbk.materialreader'
    compileSdk 37

    defaultConfig {
        applicationId "com.enderbk.materialreader"
        minSdk 24
        targetSdk 37
        versionCode 10
        versionName "1.2-hotfix1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing is optional: with keystore.properties present (local
    // maintainer builds) the release APK is signed; without it (CI,
    // F-Droid builders) the build still succeeds unsigned and the
    // distributor signs it. Never commit keys (see .gitignore).
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def hasReleaseKeys = keystorePropertiesFile.exists()
    if (hasReleaseKeys) {
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKeys) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

dependencies {
    // Compose BOM (stable). Versions of Compose libraries are managed by the BOM.
    implementation(platform("androidx.compose:compose-bom:2026.09.00"))
    androidTestImplementation(platform("androidx.compose:compose-bom:2026.09.00"))

    // Core / Activity / Lifecycle (appcompat backports per-app locales pre-33)
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Navigation Compose (stable)
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // DataStore Preferences for on-device settings + library persistence (no cloud, no account)
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Kotlinx: coroutines + serialization (library index is stored as on-device JSON)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0'

    // PDF text layer: Apache-2.0 PdfBox port for Android (offline text extraction,
    // in-document search, link annotations). Rendering itself uses the framework
    // android.graphics.pdf.PdfRenderer, so no proprietary engine is required.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Unit tests (local JVM)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0'

    // Instrumented UI tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
